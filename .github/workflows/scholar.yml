# Updates _data/scholar.json with the Google Scholar citation count.
# Runs every Monday, or manually from the repo's Actions tab ("Run workflow").
name: update-citations

on:
  schedule:
    - cron: "0 6 * * 1" # mondays at 06:00 utc
  workflow_dispatch:

permissions:
  contents: write # needed to push the updated data file

jobs:
  update:
    runs-on: ubuntu-latest
    environment: update # holds the SERPAPI_KEY secret
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # the script only uses the standard library, so there is nothing to install
      # -u stops python buffering its output, so logs and errors appear in the order they happened
      - run: python -u .github/scripts/scholar.py
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}

      # the date changes every run, so this commits weekly (a second run on the same day with no new citations commits nothing)
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898237+github-actions[bot]@users.noreply.github.com"
          git add _data/scholar.json
          git diff --staged --quiet || (git commit -m "Update citations ($(date -u +%F))." && git push)
